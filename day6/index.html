<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enroll Now: Start Your IT Training &amp; Secure Your Seat</title>
  <meta name="description" content="Ready for your career breakthrough? Secure your spot in our in-demand IT courses now. Fill the form and complete your enrollment today!" />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-left">
        <h1>Ready to Level Up? <span class="gradient-text">Enroll Now!</span></h1>
        <p class="hero-subtitle">Master the skills that matter. Whether you're starting or leveling up, we've got the course for you!</p>
      </div>
      <div class="hero-right">
        <p class="hero-quote">
          Guided by mentors who turn <strong>"I can't"</strong> into <strong>"Watch me do this!"</strong>
        </p>
        <div class="avatar-stack">
          <a class="avatar" href="#" title="Mentor">
            <img src="https://media.skillshikshya.com/media/gallery/images/saurav_19.webp" alt="Mentor" loading="lazy" />
          </a>
          <a class="avatar" href="#" title="Mentor">
            <img src="https://media.skillshikshya.com/media/gallery/images/ex5_formal_28.webp" alt="Mentor" loading="lazy" />
          </a>
          <a class="avatar" href="#" title="Mentor">
            <img src="https://media.skillshikshya.com/media/gallery/images/ex1doodle_33_auDZFR8.webp" alt="Mentor" loading="lazy" />
          </a>
          <a class="avatar" href="#" title="Mentor">
            <img src="https://media.skillshikshya.com/media/gallery/images/nitesh_9.webp" alt="Mentor" loading="lazy" />
          </a>
          <a class="avatar" href="#" title="Mentor">
            <img src="https://media.skillshikshya.com/media/gallery/images/Anjush_Khanal_cyber_sec.webp" alt="Mentor" loading="lazy" />
          </a>
          <a class="avatar-badge" href="https://skillshikshya.com/about#meet-the-mentors">+53</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ ENROLL FORM ============ -->
  <section class="form-section">
    <form class="enroll-form" action="#" method="post">

      <div class="form-row">
        <label class="form-label" for="full-name">Full Name</label>
        <div class="form-control">
          <input class="form-input" id="full-name" name="name" type="text" placeholder="Enter your Full Name" required />
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="email">Email</label>
        <div class="form-control">
          <input class="form-input" id="email" name="email" type="email" placeholder="Enter your Email" required />
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="phone">Phone Number</label>
        <div class="form-control">
          <div class="phone-wrap">
            <img src="https://purecatamphetamine.github.io/country-flag-icons/3x2/NP.svg" alt="Nepal flag" />
            <span class="phone-code">+977</span>
            <input class="form-input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Enter your Phone Number" required />
          </div>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="address">Address</label>
        <div class="form-control">
          <input class="form-input" id="address" name="address" type="text" placeholder="Enter your Address" />
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="course">Course</label>
        <div class="form-control">
          <div class="chips-row">
            <button type="button" class="chip">JRP</button>
            <button type="button" class="chip">Diploma</button>
            <button type="button" class="chip">SEE</button>
            <button type="button" class="chip">+2</button>
          </div>
          <div class="dd" data-dd>
            <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="dd-placeholder">Select your course</span>
              <svg class="dd-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <ul class="dd-panel" role="listbox">
              <li><button type="button" data-value="Graphic Design">Graphic Design</button></li>
              <li><button type="button" data-value="Web Development">Web Development</button></li>
              <li><button type="button" data-value="MERN Stack">MERN Stack</button></li>
              <li><button type="button" data-value="Python">Python</button></li>
              <li><button type="button" data-value="Cyber Security">Cyber Security</button></li>
              <li><button type="button" data-value="UI/UX Design">UI/UX Design</button></li>
              <li><button type="button" data-value="Digital Marketing">Digital Marketing</button></li>
              <li><button type="button" data-value="Data Science">Data Science</button></li>
              <li><button type="button" data-value="Mobile App Development">Mobile App Development</button></li>
              <li><button type="button" data-value="Flutter">Flutter</button></li>
              <li><button type="button" data-value="AI / Machine Learning">AI / Machine Learning</button></li>
              <li><button type="button" data-value="JRP">JRP</button></li>
              <li><button type="button" data-value="Diploma">Diploma</button></li>
              <li><button type="button" data-value="SEE">SEE</button></li>
              <li><button type="button" data-value="+2">+2</button></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="education-level">Education Level</label>
        <div class="form-control">
          <div class="dd" data-dd>
            <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="dd-placeholder">Select your education level</span>
              <svg class="dd-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <ul class="dd-panel" role="listbox">
              <li><button type="button" data-value="Below SEE">Below SEE</button></li>
              <li><button type="button" data-value="SEE">SEE</button></li>
              <li><button type="button" data-value="+2 / High School">+2 / High School</button></li>
              <li><button type="button" data-value="Bachelor's">Bachelor's</button></li>
              <li><button type="button" data-value="Master's">Master's</button></li>
              <li><button type="button" data-value="Other">Other</button></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="form-row">
        <span class="form-label">Preferred Learning Format</span>
        <div class="form-control">
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="learning_format" value="physical" id="learning_format_physical" />
              <span class="radio-circle" aria-hidden="true"></span>
              <span>Physical</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="learning_format" value="online" id="learning_format_online" />
              <span class="radio-circle" aria-hidden="true"></span>
              <span>Online</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="learning_format" value="hybrid" id="learning_format_hybrid" />
              <span class="radio-circle" aria-hidden="true"></span>
              <span>Hybrid</span>
            </label>
          </div>
        </div>
      </div>

      <div class="form-row">
        <span class="form-label">Do you have a Laptop?</span>
        <div class="form-control">
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="has_laptop" value="yes" id="has_laptop_yes" />
              <span class="radio-circle" aria-hidden="true"></span>
              <span>Yes</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="has_laptop" value="no" id="has_laptop_no" />
              <span class="radio-circle" aria-hidden="true"></span>
              <span>No</span>
            </label>
          </div>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="find-us">How did you find us?</label>
        <div class="form-control">
          <div class="dd" data-dd>
            <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="dd-placeholder">Select an option</span>
              <svg class="dd-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <ul class="dd-panel" role="listbox">
              <li><button type="button" data-value="Facebook">Facebook</button></li>
              <li><button type="button" data-value="Instagram">Instagram</button></li>
              <li><button type="button" data-value="TikTok">TikTok</button></li>
              <li><button type="button" data-value="YouTube">YouTube</button></li>
              <li><button type="button" data-value="Google Search">Google Search</button></li>
              <li><button type="button" data-value="Friends / Family">Friends / Family</button></li>
              <li><button type="button" data-value="Website / Blog">Website / Blog</button></li>
              <li><button type="button" data-value="Others">Others</button></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="form-row">
        <span class="form-label">Received any referrals?</span>
        <div class="form-control">
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="were_refered" value="yes" id="were_refered_yes" />
              <span class="radio-circle" aria-hidden="true"></span>
              <span>Yes</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="were_refered" value="no" id="were_refered_no" />
              <span class="radio-circle" aria-hidden="true"></span>
              <span>No</span>
            </label>
          </div>
        </div>
      </div>

      <div class="submit-row">
        <button class="primaryBtn" type="submit"><span>Submit Now</span></button>
      </div>

    </form>
  </section>

</body>
</html>
